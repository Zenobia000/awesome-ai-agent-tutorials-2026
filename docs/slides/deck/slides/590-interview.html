</div><svg class="rough" id="r" width="1920" height="1080"></svg>

const S=(x,y,s,f,o)=>R(x,y,s,s,f,o);
const A=(x1,y1,x2,y2,o)=>D.arrow(x1,y1,x2,y2,Object.assign({strokeWidth:2.6},o));

const MC=(cx,cy,d)=>D.ci(cx,cy,d,'ver',{fillStyle:'hachure',strokeWidth:2.4});

const N=(x,y,n)=>{D.ci(x,y,42,'ver',{fillStyle:'solid',stroke:D.C.ver,strokeWidth:2});T(x-21,y-21,n,'n',42)};
const chip=(x,y,s,t,f)=>{S(x,y,s,f);T(x,y,t,'c',s,`height:${s}px;line-height:${s}px;font-size:26px`)};
const LB=(x,y,w,h,t,f,fs)=>{R(x,y,w,h,f);T(x,y,t,'c',w,`height:${h}px;line-height:${h}px;font-size:${fs||24}px`)};
const card=(i,y,H,q)=>{const QF=H>250?32:30;R(110,y,560,H,MU,{strokeWidth:3});T(140,y+16,'題 '+(i+1),'qk');
  T(140,y+50,`<div>${q}</div>`,'qt',500,`height:${H-64}px;display:flex;align-items:center;font-size:${QF}px`);

  A(x+850,y+152,x+896,y+170,{strokeWidth:2.2});S(x+900,y+160,28,MU,{strokeWidth:2.2});A(x+932,y+174,x+958,y+174,{strokeWidth:2.2});S(x+962,y+160,28,MU,{strokeWidth:2.2});
})();

card(2,ROWS[2],H,'多智能體一定比單一 agent 好嗎？');
(()=>{const x=722,y=ROWS[2];
  N(x+40,y+32,1);T(x+68,y+14,'成本：token 約為聊天的<br>15 倍；單一 agent 約 4 倍');
  const base=y+166;LN(x+40,base,x+320,base,{strokeWidth:2.2});
  [[1,'聊天',IN],[4,'單一',MU],[15,'多個',VR]].forEach(([v,t,f],i)=>{const bh=Math.max(5,v*3.6),bx=x+56+i*104;R(bx,base-bh,50,bh,f,{strokeWidth:2.2});T(bx-27,base+3,t,'c',104);T(bx-27,base-bh-30,'×'+v,'c',104)});
  N(x+420,y+32,2);T(x+448,y+14,'適用：可平行、資訊量<br>超過單一 context 的任務');
  LB(x+420,y+130,64,44,'任務',IN);
  [112,150,188].forEach((cy,i)=>{A(x+488,y+152,x+532,y+cy-4,{strokeWidth:2});ML(x+548,y+cy-4,30,{strokeWidth:2.2});A(x+566,y+cy-4,x+606,y+152,{strokeWidth:2})});
  LB(x+612,y+130,64,44,'合併',IN);
  N(x+750,y+32,3);T(x+778,y+14,'做法：子 agent 包成工具，<br>乾淨 context、只回摘要');
  MC(x+800,y+150,56);A(x+832,y+150,x+868,y+150,{strokeWidth:2.4});TL(x+898,y+156,58);A(x+930,y+150,x+958,y+150,{strokeWidth:2.4});ML(x+986,y+150,46);
  D.curve([[x+986,y+178],[x+900,y+198],[x+812,y+182]],{stroke:D.C.ind,strokeWidth:2.2});A(x+822,y+184,x+810,y+180,{stroke:D.C.ind,strokeWidth:2.2});
})();

</script></body></html>
