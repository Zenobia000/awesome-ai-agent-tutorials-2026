<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>一任務一模型到底座</title>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/vendor/rough.js"></script><script src="../assets/draw.js"></script>
<style>
.hd{position:absolute;font-size:32px;line-height:1.2}
.nd{position:absolute;text-align:center;font-size:26px;line-height:1.3}
.al{position:absolute;text-align:center;font-size:24px;color:var(--muted);width:200px}
.br{position:absolute;width:560px;height:84px;padding:10px 24px}
.br .t{font-size:28px;line-height:1.3}
.br .d{font-size:24px;color:var(--muted);line-height:1.35}
</style></head><body><div class="slide">
  <h1>從「一任務一模型」到「一個底座」</h1>
  <p class="lead" style="width:1700px">以前每個任務都要重新標註、重新訓練；現在先用生文本練出一個底座，任務只在最後一步分岔。</p>

  <!-- 以前 -->
  <div class="hd mut" style="left:110px;top:290px">以前</div>
  <div class="nd" style="left:240px;top:372px;width:150px">生文本</div>
  <div class="al" style="left:395px;top:345px">人工標註</div>
  <div class="nd" style="left:640px;top:372px;width:150px">標註資料</div>
  <div class="al" style="left:795px;top:345px">從頭訓練</div>
  <div class="nd" style="left:1030px;top:372px;width:130px">模型 A</div>
  <div class="abs" style="left:1240px;top:350px;width:570px;font-size:26px;line-height:1.5;color:var(--muted)">情感分類一個、翻譯一個、摘要一個……<br><b>每個任務都從標註重來一次</b></div>

  <!-- 現在 -->
  <div class="hd ver" style="left:110px;top:540px">現在</div>
  <div class="nd" style="left:240px;top:722px;width:150px">生文本</div>
  <div class="al" style="left:395px;top:668px;width:230px">自監督預訓練</div>
  <div class="al" style="left:395px;top:770px;width:230px">不用人工標註</div>
  <div class="nd" style="left:660px;top:706px;width:200px;font-size:28px">預訓練模型<br><span class="lbl mut">（底座）</span></div>

  <div class="br" style="left:1250px;top:580px"><div class="t">直接下指令 → Prompt</div><div class="d">不訓練，只改輸入（模組二）</div></div>
  <div class="br" style="left:1250px;top:700px"><div class="t">把資料塞進輸入 → RAG</div><div class="d">不訓練，查到再給它看（模組三、四）</div></div>
  <div class="br" style="left:1250px;top:820px"><div class="t">少量標註精調 → LoRA</div><div class="d">只動一點權重（模組六）</div></div>

  <div class="abs" style="left:1650px;top:290px"><span class="tag">本課整理</span></div>
  <div class="read"><em>怎麼讀：</em>上排每個任務各走一遍「標註 → 訓練」；下排只練一次底座，右邊三條路就是這門課接下來的章節。</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r');
const doc=(x,y)=>{[[12,-12],[6,-6],[0,0]].forEach(([dx,dy])=>D.rect(x+dx,y+dy,120,90,'#d9e1ee',{fillStyle:'solid',stroke:D.C.ind,strokeWidth:2.4}));};
/* 以前：三層疊起來代表每個任務各一條 */
[[24,24],[12,12],[0,0]].forEach(([dx,dy],i)=>{const a=i<2?{stroke:D.C.grey}:{};
  D.rect(255+dx,350+dy,120,90,i<2?'#f3efe6':'#d9e1ee',Object.assign({fillStyle:'solid',stroke:D.C.ind,strokeWidth:2.4},a));
  D.rect(655+dx,350+dy,120,90,i<2?'#f3efe6':'#f7e7c0',Object.assign({fillStyle:'solid',stroke:'#b98a12',strokeWidth:2.4},a));
  D.ci(1095+dx,395+dy,96,i<2?'#f3efe6':'#f7d6cf',Object.assign({fillStyle:'solid',stroke:D.C.ver,strokeWidth:2.6},a));});
D.arrow(385,395,645,395,{strokeWidth:2.8});D.arrow(785,395,1040,395,{strokeWidth:2.8});
D.dash(110,500,1810,500,{stroke:D.C.grey,strokeWidth:2});
/* 現在 */
doc(255,700);
D.arrow(395,745,640,745,{strokeWidth:3});
D.ci(760,745,220,'#f7d6cf',{fillStyle:'solid',stroke:D.C.ver,strokeWidth:3});
[622,742,862].forEach(y=>D.arrow(875,745,1240,y,{strokeWidth:2.8}));
D.rect(1250,580,560,84,'#f7e7c0',{fillStyle:'solid',stroke:'#b98a12',strokeWidth:2.6});
D.rect(1250,700,560,84,'#d9e1ee',{fillStyle:'solid',stroke:D.C.ind,strokeWidth:2.6});
D.rect(1250,820,560,84,'#f7d6cf',{fillStyle:'solid',stroke:D.C.ver,strokeWidth:2.6});
</script></body></html>
