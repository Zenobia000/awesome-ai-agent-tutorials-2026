<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Global Search 社群報告</title>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/vendor/rough.js"></script><script src="../assets/draw.js"></script>
<style>
.zh{position:absolute;font-size:30px;line-height:1.3}
.rp{position:absolute;display:flex;align-items:center;justify-content:center;width:280px;height:100px;font-size:26px;text-align:center;line-height:1.35}
.pt{position:absolute;display:flex;align-items:center;justify-content:center;width:130px;height:56px;font-size:26px}
</style></head><body><div class="slide">
  <h1>Global Search：先分社群，再讀報告</h1>
  <p class="lead">社群報告在建索引時就寫好；查詢時只對報告做 map-reduce，不必重讀原文。</p>

  <div class="zh ind" style="left:110px;top:272px">索引時：先做好</div>
  <div class="zh ver" style="left:960px;top:272px">查詢時：map-reduce</div>

  <div class="abs lbl mut" style="left:110px;top:760px;width:400px">Leiden：由細到粗的多層社群</div>
  <div class="abs lbl mut" style="left:560px;top:760px;width:300px">LLM 預寫的社群報告</div>
  <div class="abs lbl mut" style="left:1000px;top:760px;width:330px;text-align:center">map：每份各答一次</div>
  <div class="abs lbl mut" style="left:1400px;top:760px;width:300px;text-align:center">reduce：合併</div>

  <div class="rp" style="left:560px;top:340px">社群報告 A</div>
  <div class="rp" style="left:560px;top:490px">社群報告 B</div>
  <div class="rp" style="left:560px;top:640px">社群報告 C</div>
  <div class="pt" style="left:1195px;top:362px">要點</div>
  <div class="pt" style="left:1195px;top:512px">要點</div>
  <div class="pt" style="left:1195px;top:662px">要點</div>
  <div class="abs" style="left:1480px;top:500px;width:140px;text-align:center;font-size:30px;line-height:80px">LLM</div>
  <div class="abs" style="left:1690px;top:500px;width:120px;text-align:center;font-size:28px;line-height:80px">答案</div>

  <div class="abs" style="left:1025px;top:365px;width:110px;text-align:center;font-size:26px;line-height:50px">LLM</div>
  <div class="abs" style="left:1025px;top:515px;width:110px;text-align:center;font-size:26px;line-height:50px">LLM</div>
  <div class="abs" style="left:1025px;top:665px;width:110px;text-align:center;font-size:26px;line-height:50px">LLM</div>
  <div class="bridge" style="left:110px;top:815px;width:1700px"><span class="k">你已經會的</span>Leiden 是由細到粗的階層分群（像 dendrogram）；社群報告就是預先算好的每層摘要。</div>
  <div class="read"><em>怎麼讀：</em>虛線左邊建索引時就做完；右邊每個圓各讀一份報告，最後合併成答案。</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r');
const IND=['#d9e1ee',D.C.ind],MUS=['#f7e7c0','#b98a12'],VER=['#f7d6cf',D.C.ver];
const R=(x,y,w,h,f,o)=>D.rect(x,y,w,h,f[0],Object.assign({fillStyle:'solid',stroke:f[1],strokeWidth:3},o||{}));
const sq=(x,y,s,f)=>R(x,y,s,s,f,{strokeWidth:2.5});
const blob=(x,y,w,h,col)=>D.poly([[x,y+10],[x+w*0.3,y-4],[x+w,y+8],[x+w+4,y+h*0.6],[x+w*0.6,y+h+6],[x+6,y+h]],null,{stroke:col,strokeWidth:3,strokeLineDash:[9,8]});
const ar=(x1,y1,x2,y2,o)=>D.arrow(x1,y1,x2,y2,Object.assign({strokeWidth:3},o));
D.dash(900,290,900,800,{stroke:D.C.grey,strokeWidth:2.5});

/* 圖與三個社群 */
const A=[[145,365],[220,350],[262,412],[168,422]],B=[[362,432],[432,420],[402,492],[458,512]],C=[[182,612],[252,600],[302,662],[217,677]];
const edges=(P,pairs)=>pairs.forEach(([i,j])=>D.line(P[i][0]+11,P[i][1]+11,P[j][0]+11,P[j][1]+11,{strokeWidth:2}));
edges(A,[[0,1],[1,2],[0,3],[2,3]]);edges(B,[[0,1],[0,2],[1,3],[2,3]]);edges(C,[[0,1],[1,2],[0,3],[2,3]]);
D.line(273,423,373,443,{strokeWidth:2});D.line(190,433,193,623,{strokeWidth:2});D.line(413,503,313,673,{strokeWidth:2});
blob(112,326,200,150,D.C.ind);blob(335,400,160,150,'#b98a12');blob(150,572,210,150,D.C.ver);
A.forEach(([x,y])=>sq(x,y,22,IND));B.forEach(([x,y])=>sq(x,y,22,MUS));C.forEach(([x,y])=>sq(x,y,22,VER));

/* 報告 */
R(560,340,280,100,IND);R(560,490,280,100,MUS);R(560,640,280,100,VER);
ar(316,372,552,384);ar(500,478,552,538);ar(362,668,552,690);

/* map：三個圓各讀一份報告 */
[[390,IND],[540,MUS],[690,VER]].forEach(([y],i)=>{
  ar(848,[390,540,690][i],1020,y);
  D.ci(1080,y,110,'ver',{fillStyle:'hachure',strokeWidth:2.4});
  ar(1140,y,1186,y);
  R(1195,y-28,130,56,[IND,MUS,VER][i],{strokeWidth:2.5});
  ar(1330,y,1450,540+(y-540)*0.35);
});
/* reduce */
D.ci(1550,540,180,'ver',{fillStyle:'hachure',strokeWidth:2.6});
ar(1645,540,1685,540);R(1692,495,118,90,['#fbf9f4',D.C.ink],{strokeWidth:3});
</script></body></html>
