<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>RNN 的瓶頸</title>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/vendor/rough.js"></script><script src="../assets/draw.js"></script>
<style>
.a{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;font-size:28px}
.card{position:absolute;left:110px;top:742px;width:830px;height:160px;padding:0 30px 0 100px;display:flex;align-items:center;font-size:28px;line-height:1.5}
</style></head><body><div class="slide">
  <h1>RNN 的瓶頸：整句話擠進一個向量</h1>
  <p class="lead">RNN 一個字一個字讀，所有資訊都存在一個固定大小的隱藏狀態裡。句子越長，越前面的越容易被擠掉。</p>
  <div id="g"></div>
  <div class="card"><span><b>瓶頸</b>：不管句子多長，交給下游的只有最後那一個固定大小的向量。</span></div>
  <div class="bridge" style="left:980px;top:742px;width:830px;height:160px;display:flex;flex-direction:column;justify-content:center"><span class="k">你已經會的</span>梯度要穿過每個時間步，才有梯度消失；第 t 步要等第 t−1 步，無法平行。</div>
  <div class="read"><em>怎麼讀：</em>下排是輸入的 token，上排方塊是隱藏狀態，一格傳給下一格；最後只有最右邊那一格被交出去。</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r');
const g=document.getElementById('g');
const el=(x,y,w,h,t,st)=>{const e=document.createElement('div');e.className='a';e.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;`+(st||'');e.innerHTML=t;g.appendChild(e);return e};
const T=['今天','天','氣','真','好','，'],X=i=>150+i*175;
T.forEach((t,i)=>{const x=X(i);
  D.rect(x,630,110,64,'#d9e1ee',{fillStyle:'solid',stroke:D.C.ind,strokeWidth:2.5});el(x,630,110,64,t);
  D.arrow(x+55,624,x+55,572,{strokeWidth:2.5});
  D.rect(x+5,462,100,100,i===5?'#f7e7c0':'#f7e7c0',{fillStyle:'solid',stroke:'#b98a12',strokeWidth:i===5?4:2.6});
  el(x+5,462,100,100,'h<sub style="font-size:20px">'+(i+1)+'</sub>','font-size:34px');
  if(i<5)D.arrow(x+108,512,X(i+1)+2,512,{strokeWidth:2.5});
});
/* 第 1 個 token 的資訊一路被覆寫 */
D.curve([[X(0)+55,452],[(X(0)+X(5))/2+55,372],[X(5)+55,452]],{stroke:D.C.ver,strokeWidth:2.6,strokeLineDash:[10,10]});
D.arrow(X(5)+49,440,X(5)+55,452,{stroke:D.C.ver,strokeWidth:2.6});
el(X(0)+60,320,780,40,'第 1 個 token 的資訊要穿過 5 次更新才到終點，一路被覆寫','font-size:26px;color:#e0442b');
/* 漏斗 */
D.arrow(X(5)+110,512,1170,512,{strokeWidth:2.8});
D.poly([[1180,440],[1330,488],[1330,536],[1180,584]],'#f7e7c0',{fillStyle:'solid',stroke:'#b98a12',strokeWidth:2.6});
el(1160,598,200,70,'固定大小<br>的一個向量','font-size:24px;color:#5b574f');
D.arrow(1338,512,1440,512,{strokeWidth:2.8});
D.tri(160,822,64,'ver',{strokeWidth:2.4});
D.ci(1580,512,220,'ver',{fillStyle:'hachure',strokeWidth:2.6});
el(1500,482,160,60,'下游','font-size:38px');
</script></body></html>
