<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>模組七面試題</title>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/vendor/rough.js"></script><script src="../assets/draw.js"></script>
<style>
.t{position:absolute;font-size:24px;line-height:1.3;white-space:nowrap}
.t.qt{font-size:30px;line-height:1.42;white-space:normal}
.t.qk{color:#b98a12}
.t.n{font-size:26px;line-height:42px;height:42px;text-align:center;color:#fff}

</style></head><body><div class="slide">
  <h1>面試題：MCP 與低代碼</h1>
  <p class="lead">兩題都是「講得出邊界」的題目；照維度各講一句，比背定義有用。</p>
  <div id="g"></div>
  <div class="read"><em>怎麼讀：</em>左邊黃框是題目，右邊小圖把「回答維度」畫在本章主視覺上（示意）；紅圈編號是回答順序，有例子就帶上 Lab7。</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r'),G=document.getElementById('g');
/* ── 共用版型：左題目卡、右縮圖面板、紅圈編號＝回答順序 ── */
const IN=['#d9e1ee',D.C.ind],MU=['#f7e7c0','#b98a12'],VR=['#f7d6cf',D.C.ver],PA=['#fbf9f4',D.C.grey],GY=['#ece8dc',D.C.grey];
const T=(x,y,t,c,w,st)=>{const e=document.createElement('div');e.className='t '+(c||'');e.style.cssText=`left:${x}px;top:${y}px;`+(w?`width:${w}px;`:'')+(st||'');e.innerHTML=t;G.appendChild(e);return e};
const R=(x,y,w,h,f,o)=>D.rect(x,y,w,h,f[0],Object.assign({fillStyle:'solid',stroke:f[1],strokeWidth:2.6},o));
const S=(x,y,s,f,o)=>R(x,y,s,s,f,o);
const A=(x1,y1,x2,y2,o)=>D.arrow(x1,y1,x2,y2,Object.assign({strokeWidth:2.6},o));
const LN=(x1,y1,x2,y2,o)=>D.line(x1,y1,x2,y2,Object.assign({strokeWidth:2.4},o));
const DS=(x1,y1,x2,y2,o)=>D.dash(x1,y1,x2,y2,Object.assign({strokeWidth:2.4},o));
const TL=(cx,cy,s)=>D.tri(cx,cy,s,'mus',{strokeWidth:2.4});
const GT=(cx,cy,s)=>D.tri(cx,cy,s,'#f7d6cf',{stroke:D.C.ver,strokeWidth:2.6});
const MC=(cx,cy,d)=>D.ci(cx,cy,d,'ver',{fillStyle:'hachure',strokeWidth:2.4});
const ML=(cx,cy,d,o)=>D.ci(cx,cy,d,'#f7d6cf',Object.assign({fillStyle:'solid',stroke:D.C.ver,strokeWidth:2.6},o));
const N=(x,y,n)=>{D.ci(x,y,42,'ver',{fillStyle:'solid',stroke:D.C.ver,strokeWidth:2});T(x-21,y-21,n,'n',42)};
const chip=(x,y,s,t,f)=>{S(x,y,s,f);T(x,y,t,'c',s,`height:${s}px;line-height:${s}px;font-size:26px`)};
const LB=(x,y,w,h,t,f,fs)=>{R(x,y,w,h,f);T(x,y,t,'c',w,`height:${h}px;line-height:${h}px;font-size:${fs||24}px`)};
const card=(i,y,H,q)=>{const QF=H>250?32:30;R(110,y,560,H,MU,{strokeWidth:3});T(140,y+16,'題 '+(i+1),'qk');
  T(140,y+50,`<div>${q}</div>`,'qt',500,`height:${H-64}px;display:flex;align-items:center;font-size:${QF}px`);
  A(676,y+H/2,716,y+H/2,{strokeWidth:3});R(722,y,1088,H,PA,{strokeWidth:3});};
const ROWS=[280,620],H=320;

/* 題 1：MCP 架構（702、703 縮圖） */
card(0,ROWS[0],H,'請闡述 MCP 的技術架構，以及它為何被視為大模型時代的外掛整合標準？');
(()=>{const x=722,y=ROWS[0];
  DS(x+452,y+30,x+452,y+300,{stroke:D.C.grey,strokeWidth:2});
  // ① 痛點：N×M → N+M
  N(x+40,y+34,1);T(x+68,y+18,'痛點：N × M 個客製接頭，<br>降成 N + M 個');
  [112,150,188].forEach(cy=>{ML(x+70,y+cy,34);A(x+92,y+cy,x+164,y+cy,{strokeWidth:2.2});A(x+246,y+cy,x+302,y+cy,{strokeWidth:2.2});TL(x+330,y+cy+4,38)});
  LB(x+170,y+88,70,126,'MCP',MU);
  T(x+40,y+218,'N 個應用','mut');T(x+270,y+218,'M 個工具','mut');
  // ④ 生態與治理
  N(x+40,y+272,4);T(x+68,y+258,'生態治理：主流客戶端都支援，<br>Linux Foundation 基金會中立治理');
  // ② 架構
  N(x+490,y+34,2);T(x+518,y+18,'架構：Host／Client／Server，<br>資料層與傳輸層分開');
  R(x+500,y+86,270,120,PA,{strokeLineDash:[10,9],strokeWidth:2.4});T(x+514,y+90,'Host','ind');
  MC(x+556,y+156,52);LB(x+610,y+135,96,42,'Client',IN);
  A(x+712,y+156,x+832,y+156);T(x+720,y+118,'資料層','mut');T(x+720,y+166,'傳輸層','mut');
  TL(x+884,y+162,66);T(x+846,y+196,'Server','mus');
  // ③ 原語
  N(x+490,y+244,3);T(x+518,y+230,'原語：差在誰決定何時用');
  LB(x+520,y+266,100,40,'Tools',MU);LB(x+628,y+266,150,40,'Resources',MU);LB(x+786,y+266,120,40,'Prompts',MU);
})();

/* 題 2：低代碼 vs LangGraph（708 縮圖） */
card(1,ROWS[1],H,'在大型企業軟體架構中，如何界定 Dify／n8n 與 LangGraph 純程式碼架構各自的應用邊界？');
(()=>{const x=722,y=ROWS[1];
  N(x+40,y+34,1);T(x+68,y+18,'路徑：事先畫得出來用低代碼；<br>要依狀態動態決定用 LangGraph');
  N(x+668,y+34,2);T(x+696,y+18,'控制：重試、人工審批、<br>暫停恢復，寫程式碼');
  R(x+30,y+88,310,134,['#fbf9f4',D.C.ind],{strokeWidth:2.6});T(x+46,y+94,'Dify／n8n','ind');
  S(x+48,y+156,34,IN,{strokeWidth:2.2});A(x+86,y+173,x+110,y+173,{strokeWidth:2.2});ML(x+132,y+173,34);A(x+154,y+173,x+176,y+173,{strokeWidth:2.2});TL(x+204,y+176,40);A(x+228,y+173,x+252,y+173,{strokeWidth:2.2});S(x+258,y+156,34,IN,{strokeWidth:2.2});
  R(x+640,y+88,420,134,['#fbf9f4',D.C.ver],{strokeWidth:2.6});T(x+656,y+94,'LangGraph','ver');
  S(x+660,y+156,34,IN,{strokeWidth:2.2});DS(x+698,y+173,x+752,y+173,{strokeWidth:2.2});MC(x+786,y+173,62);
  D.curve([[x+812,y+150],[x+870,y+126],[x+926,y+146]],{strokeWidth:2.4});A(x+912,y+138,x+930,y+148,{strokeWidth:2.4});
  D.curve([[x+926,y+200],[x+870,y+222],[x+812,y+198]],{strokeWidth:2.4});A(x+826,y+212,x+810,y+198,{strokeWidth:2.4});
  TL(x+956,y+176,46);GT(x+1024,y+180,40);
  // ④ MCP 互接
  A(x+500,y+160,x+354,y+160);A(x+500,y+160,x+626,y+160);T(x+470,y+116,'MCP','ind');N(x+500,y+98,4);
  T(x+376,y+176,'組合：透過 MCP 互接，<br>不是二選一','c',250);
  // ③ 交付
  N(x+40,y+266,3);T(x+68,y+250,'交付：快速原型、整合排程<br>與第三方，低代碼快');
})();

</script></body></html>
