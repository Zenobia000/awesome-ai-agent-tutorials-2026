<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>模組 1 踩坑三則</title>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/vendor/rough.js"></script><script src="../assets/draw.js"></script>
<style>
.a{position:absolute;display:flex;align-items:center;justify-content:flex-start;line-height:1.4;font-size:26px}
.hd{position:absolute;top:262px;font-size:30px}
</style></head><body><div class="slide">
  <h1>踩坑：三個最常見的</h1>
  <div class="hd ver" style="left:360px">症狀</div><div class="hd mut" style="left:850px">原因</div><div class="hd ind" style="left:1340px">修法</div>
  <div id="g"></div>
  <div class="read"><em>怎麼讀：</em>每一列一個坑，由左往右：看到什麼症狀、為什麼會這樣、怎麼修。</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r');
const g=document.getElementById('g');
const el=(x,y,w,h,t,st)=>{const e=document.createElement('div');e.className='a';e.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;`+(st||'');e.innerHTML=t;g.appendChild(e);return e};
const R=[
 {n:'顯存溢出<br>OOM',s:'載入模型就崩潰，出現 CUDA out of memory',c:'模型檔放不進顯存；context 也要佔顯存',f:'16 GB 單卡選 7B／8B 的 4-bit 量化版；或租雲端算力（AutoDL、ModelScope）'},
 {n:'溫度<br>誤解',s:'溫度調到 0，答案還是錯，或開始一直重複',c:'溫度只管分佈的尖或平，不管事實對錯',f:'照模型官方建議值（R1 distill 是 0.5–0.7）；正確性靠資料與驗證'},
 {n:'context<br>被截斷',s:'聊著聊著模型像失憶，長文件的後半被忽略',c:'Ollama 預設 num_ctx 是 4096，超過的部分被截斷',f:'設環境變數 OLLAMA_CONTEXT_LENGTH，或原生 API 帶 num_ctx；歷史太長就摘要'}];
R.forEach((r,i)=>{const y=322+i*188,h=164;
  D.tri(165,y+h/2,76,'mus',{stroke:D.C.ink,strokeWidth:2.6});
  el(214,y,140,h,r.n,'font-size:28px;line-height:1.3');
  D.rect(360,y,440,h,'#f7d6cf',{fillStyle:'solid',stroke:D.C.ver,strokeWidth:2.6});el(380,y,400,h,r.s);
  D.arrow(806,y+h/2,846,y+h/2,{strokeWidth:2.6});
  D.rect(850,y,440,h,'#fbf9f4',{fillStyle:'solid',stroke:D.C.grey,strokeWidth:2.6});el(870,y,400,h,r.c);
  D.arrow(1296,y+h/2,1336,y+h/2,{strokeWidth:2.6});
  D.rect(1340,y,470,h,'#d9e1ee',{fillStyle:'solid',stroke:D.C.ind,strokeWidth:2.6});el(1360,y,430,h,r.f);
});
</script></body></html>
