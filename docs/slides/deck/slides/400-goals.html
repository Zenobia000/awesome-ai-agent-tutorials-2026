<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>模組四 學習目標</title>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/vendor/rough.js"></script><script src="../assets/draw.js"></script>
<style>
.goal-h{font-size:44px;line-height:1.3}
ul.dots li{font-size:34px;line-height:1.5;margin:28px 0}
</style></head><body><div class="slide">
  <h1 class="xl">模組 4</h1>
  <h1 style="font-size:72px;margin-top:6px">知識圖譜與 GraphRAG</h1>
  <p class="lead" style="width:880px">向量擅長找「像」，圖擅長找「連」。<br>先用向量找到入口，再順著關係走下去。</p>

  <div class="abs goal-h ind" style="left:1010px;top:110px">學習目標</div>
  <ul class="dots abs" style="left:1010px;top:190px;width:800px">
    <li>說得出向量 RAG 的兩個盲點：<br><b>多跳關係</b>、<b>全局總結</b></li>
    <li>用實體、關係、屬性建模，<br>看懂 Cypher 的多跳查詢</li>
    <li>讓 LLM 從文字抽出三元組，<br>寫進 Neo4j</li>
    <li>分清兩派 GraphRAG：<br><b>社群報告派</b>與 <b>Cypher 多跳派</b></li>
  </ul>

  <div class="abs goal-h" style="left:150px;top:858px;width:200px;line-height:1.2">本章<br>實戰</div>
  <div class="abs" style="left:380px;top:850px;width:1380px;font-size:30px;line-height:1.55"><b style="color:var(--ink)">Lab 4：《凡人修仙傳》人物關係圖譜</b><br><span class="mut" style="font-size:28px">LLM 從小說文本抽出人物、宗門、法寶的關係，寫進 Neo4j，再用 Cypher 多跳查詢回答。</span></div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r');
/* 大圓（模型）＋圖：中央圓是 LLM，周圍的方塊是被連起來的實體 */
const cx=430,cy=665,R=110;
const pts=[[430,505,'#f7e7c0','#b98a12'],[215,610,'#d9e1ee',D.C.ind],[245,765,'#f7e7c0','#b98a12'],[665,595,'#f7d6cf',D.C.ver],[655,765,'#d9e1ee',D.C.ind]];
pts.forEach(([x,y])=>{const a=Math.atan2(y-cy,x-cx);D.line(cx+R*Math.cos(a),cy+R*Math.sin(a),x,y,{strokeWidth:2.5});});
D.line(215,610,245,765,{strokeWidth:2.5});D.line(665,595,655,765,{strokeWidth:2.5});
D.ci(cx,cy,2*R,'ver',{fillStyle:'hachure',strokeWidth:2.6});
pts.forEach(([x,y,f,s])=>D.rect(x-32,y-32,64,64,f,{fillStyle:'solid',stroke:s,strokeWidth:3}));
/* 本章實戰框 */
D.rect(110,830,1700,145,'#f7e7c0',{fillStyle:'solid',stroke:'#b98a12',strokeWidth:3});
</script></body></html>
