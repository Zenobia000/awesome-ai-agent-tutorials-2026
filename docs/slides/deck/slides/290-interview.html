<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>面試題：輸出與注入</title>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/vendor/rough.js"></script><script src="../assets/draw.js"></script>
<style>

</style></head><body><div class="slide">
  <h1>面試題：結構化、思維鏈、注入</h1>

  <div id="g"></div>
  <div class="read"><em>怎麼讀：</em>左邊黃框是題目，右邊小圖把「回答維度」畫在本章主視覺上（示意）；紅圈編號是回答順序，先講 1 再講 2。</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r'),G=document.getElementById('g');
/* ── 共用版型：左題目卡、右縮圖面板、紅圈編號＝回答順序 ── */
const IN=['#d9e1ee',D.C.ind],MU=['#f7e7c0','#b98a12'],VR=['#f7d6cf',D.C.ver],PA=['#fbf9f4',D.C.grey],GY=['#ece8dc',D.C.grey];
const T=(x,y,t,c,w,st)=>{const e=document.createElement('div');e.className='t '+(c||'');e.style.cssText=`left:${x}px;top:${y}px;`+(w?`width:${w}px;`:'')+(st||'');e.innerHTML=t;G.appendChild(e);return e};
const R=(x,y,w,h,f,o)=>D.rect(x,y,w,h,f[0],Object.assign({fillStyle:'solid',stroke:f[1],strokeWidth:2.6},o));
const S=(x,y,s,f,o)=>R(x,y,s,s,f,o);
const A=(x1,y1,x2,y2,o)=>D.arrow(x1,y1,x2,y2,Object.assign({strokeWidth:2.6},o));
const LN=(x1,y1,x2,y2,o)=>D.line(x1,y1,x2,y2,Object.assign({strokeWidth:2.4},o));
const DS=(x1,y1,x2,y2,o)=>D.dash(x1,y1,x2,y2,Object.assign({strokeWidth:2.4},o));
const TL=(cx,cy,s)=>D.tri(cx,cy,s,'mus',{strokeWidth:2.4});
const GT=(cx,cy,s)=>D.tri(cx,cy,s,'#f7d6cf',{stroke:D.C.ver,strokeWidth:2.6});
const MC=(cx,cy,d)=>D.ci(cx,cy,d,'ver',{fillStyle:'hachure',strokeWidth:2.4});
const ML=(cx,cy,d,o)=>D.ci(cx,cy,d,'#f7d6cf',Object.assign({fillStyle:'solid',stroke:D.C.ver,strokeWidth:2.6},o));
const N=(x,y,n)=>{D.ci(x,y,42,'ver',{fillStyle:'solid',stroke:D.C.ver,strokeWidth:2});T(x-21,y-21,n,'n',42)};
const chip=(x,y,s,t,f)=>{S(x,y,s,f);T(x,y,t,'c',s,`height:${s}px;line-height:${s}px;font-size:26px`)};
const LB=(x,y,w,h,t,f,fs)=>{R(x,y,w,h,f);T(x,y,t,'c',w,`height:${h}px;line-height:${h}px;font-size:${fs||24}px`)};
const card=(i,y,H,q)=>{const QF=H>250?32:30;R(110,y,560,H,MU,{strokeWidth:3});T(140,y+16,'題 '+(i+1),'qk');
  T(140,y+50,`<div>${q}</div>`,'qt',500,`height:${H-64}px;display:flex;align-items:center;font-size:${QF}px`);
  A(676,y+H/2,716,y+H/2,{strokeWidth:3});R(722,y,1088,H,PA,{strokeWidth:3});};
const ROWS=[280,503,726],H=205;

/* 題 1：結構化保障三層（208 縮圖） */
card(0,ROWS[0],H,'如何確保大模型的輸出符合後端程式的接口規範？有哪幾種主流的結構化保障策略？');
(()=>{const x=722,y=ROWS[0];
  [['提示要求',VR,46],['原生輸出',MU,84],['Pydantic 驗證',IN,122]].forEach(([t,f,h],i)=>{const sx=x+30+i*182;R(sx,y+192-h,182,h,f);T(sx,y+192-h+8,t,'c',182)});
  N(x+50,y+34,1);T(x+80,y+16,'三層疊用：提示 → 原生輸出<br>→ Pydantic 驗證');
  N(x+640,y+34,2);T(x+670,y+16,'別答百分之百：拒答、<br>截斷、業務規則仍會漏');
  S(x+950,y+18,64,VR);D.cross(x+982,y+50,18);
  N(x+640,y+136,3);T(x+670,y+118,'補上失敗處理：<br>重試、降級、回報錯誤');
  GT(x+985,y+156,76);
})();

/* 題 2：CoT 與 ToT（205 縮圖） */
card(1,ROWS[1],H,'請闡述思維鏈（CoT）與思維樹（ToT）在複雜任務拆解中的運作原理與局限。');
(()=>{const x=722,y=ROWS[1];
  N(x+40,y+34,1);T(x+70,y+16,'CoT 多寫幾步＝多算幾步；<br>ToT 分支、自評、剪枝');
  T(x+30,y+88,'CoT','ind');
  [0,1,2,3].forEach(i=>{S(x+30+i*58,y+125,34,IN,{strokeWidth:2.2});if(i<3)A(x+68+i*58,y+142,x+86+i*58,y+142,{strokeWidth:2.2})});
  T(x+262,y+88,'ToT','ver');
  S(x+262,y+125,34,IN,{strokeWidth:2.2});
  [[92,IN],[128,MU],[164,VR]].forEach(([dy,f],i)=>{const cy=y+dy+14;A(x+300,y+142,x+346,cy,{strokeWidth:2.2});S(x+350,y+dy,28,f,{strokeWidth:2.2})});
  D.cross(x+403,y+178,14,{strokeWidth:3.5});
  A(x+382,y+106,x+412,y+106,{strokeWidth:2.2});S(x+416,y+92,28,IN,{strokeWidth:2.2});
  N(x+480,y+34,2);T(x+508,y+16,'局限：成本倍增、<br>自評會錯、<br>要有可驗證的中間步');
  [[0,1],[1,3],[2,5]].forEach(([r,n])=>{for(let k=0;k<n;k++)ML(x+660+(k-(n-1)/2)*30,y+128+r*26,22,{strokeWidth:2.2})});
  N(x+780,y+34,3);T(x+808,y+16,'加分：推理模型已內建，<br>重心改成定義成功條件');
  MC(x+850,y+156,70);A(x+890,y+156,x+920,y+156);LB(x+924,y+132,120,48,'成功條件',MU);
})();

/* 題 3：提示詞注入（206 縮圖） */
card(2,ROWS[2],H,'如何防禦提示詞注入？只用 XML 標籤隔離夠嗎？');
(()=>{const x=722,y=ROWS[2];
  N(x+40,y+34,1);T(x+70,y+16,'根源：指令與資料<br>在同一條序列');
  [IN,IN,IN,MU,MU,VR,VR,IN].forEach((f,i)=>S(x+30+i*41,y+129,28,f,{strokeWidth:2.2}));
  A(x+340,y+143,x+388,y+143);
  N(x+420,y+34,2);T(x+448,y+16,'不夠：標籤只降機率，<br>要分層：審核、驗證、權限');
  LB(x+396,y+116,70,56,'標籤',GY);LB(x+494,y+116,70,56,'審核',IN);LB(x+592,y+116,70,56,'驗證',IN);
  A(x+470,y+144,x+490,y+144,{strokeWidth:2.2});A(x+568,y+144,x+588,y+144,{strokeWidth:2.2});
  A(x+666,y+144,x+698,y+144);MC(x+730,y+144,60);A(x+764,y+144,x+806,y+144);
  N(x+760,y+34,3);T(x+788,y+16,'底線：最小權限，<br>高風險動作要人工核准');
  GT(x+846,y+152,80);A(x+892,y+152,x+940,y+152);TL(x+974,y+156,60);
})();

</script></body></html>
