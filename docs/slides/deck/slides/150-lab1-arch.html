<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Lab 1 雙軌客戶端架構</title>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/vendor/rough.js"></script><script src="../assets/draw.js"></script>
<style>
.a{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;font-size:26px}
.m{font-family:"JetBrains Mono",monospace;font-size:22px}
</style></head><body><div class="slide">
  <h1>Lab 1 架構：本地為主，雲端備援</h1>
  <p class="lead">messages 先送本地 Ollama；連不上或逾時，才切到雲端 DeepSeek。輸出用串流。</p>
  <div id="g"></div>
  <p class="abs" style="left:110px;top:834px;width:1700px;font-size:26px;line-height:1.55;color:#5b574f"><span style="color:#1b1b1b">做法：</span>① 拉模型並確認服務在跑　② 環境變數注入 base_url 與 API Key　③ generator 接串流。DeepSeek 模型名開課前再核對。</p>
  <div class="read"><em>怎麼讀：</em>由左往右：資料進客戶端，圓是兩個模型；實線是主路徑，虛線經過三角閘門，只有本地失敗才會走。</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r');
const g=document.getElementById('g');
const el=(c,x,y,w,h,t,st)=>{const e=document.createElement('div');e.className='a '+c;e.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;`+(st||'');e.innerHTML='<div>'+t+'</div>';g.appendChild(e);return e};
/* 左：資料 */
D.rect(110,320,290,110,'#d9e1ee',{fillStyle:'solid',stroke:D.C.ind,strokeWidth:2.8});el('',110,320,290,110,'環境變數<br>base_url、API Key');
D.rect(110,500,290,110,'#d9e1ee',{fillStyle:'solid',stroke:D.C.ind,strokeWidth:2.8});el('',110,500,290,110,'messages<br>整段對話歷史');
D.arrow(404,375,512,425,{strokeWidth:2.6});D.arrow(404,555,512,520,{strokeWidth:2.6});
/* 客戶端 */
D.rect(520,350,300,240,'#fbf9f4',{fillStyle:'solid',stroke:D.C.ink,strokeWidth:3});
el('',520,362,300,50,'雙軌客戶端','font-size:32px');
el('',540,420,260,150,'① 先試本地<br>② 失敗就改雲端<br>③ yield 串流給呼叫端','font-size:24px;line-height:1.7;color:#5b574f');
/* 本地 */
D.arrow(826,420,1128,392,{strokeWidth:3});
el('',840,330,300,40,'實線：主路徑','font-size:24px;color:#5b574f');
D.ci(1250,385,224,'#f7d6cf',{fillStyle:'solid',stroke:D.C.ink,strokeWidth:2.8});
el('',1140,345,220,80,'本地 Ollama<br><span class="m">qwen3.5:9b</span>','font-size:26px');
/* 備援：經過三角閘門 */
D.dash(670,596,670,690,{strokeWidth:2.8});D.dash(670,690,880,690,{strokeWidth:2.8});D.arrow(870,690,892,690,{strokeWidth:2.8});
D.tri(960,690,110,'mus',{stroke:D.C.ink,strokeWidth:2.8});
el('',860,752,200,70,'連不上、逾時？<br>才走這條','font-size:24px;color:#5b574f');
D.arrow(1020,690,1128,690,{strokeWidth:2.8,strokeLineDash:[10,10]});
D.ci(1250,690,224,'#f7d6cf',{fillStyle:'solid',stroke:D.C.ink,strokeWidth:2.8});
el('',1140,650,220,80,'雲端 DeepSeek<br><span class="m">deepseek-flash</span>','font-size:26px');
/* 輸出 */
D.rect(1560,470,250,150,'#f7e7c0',{fillStyle:'solid',stroke:'#b98a12',strokeWidth:3});
el('',1560,470,250,150,'串流輸出<br>一次一個片段','font-size:28px');
D.arrow(1358,410,1550,500,{strokeWidth:2.8});D.arrow(1358,672,1550,590,{strokeWidth:2.8,strokeLineDash:[10,10]});
</script></body></html>
