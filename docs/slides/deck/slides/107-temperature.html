<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>溫度只管隨機性</title>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/vendor/rough.js"></script><script src="../assets/draw.js"></script>
<style>
.a{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;font-size:26px}
.card{position:absolute;left:960px;top:690px;width:850px;height:200px;padding:6px 30px 0 96px}
.card .h{font-size:34px;color:var(--ver);line-height:1.3}
.card p{font-size:26px;line-height:1.5;margin-top:8px}
</style></head><body><div class="slide">
  <h1>溫度：同一個分佈，調尖或調平</h1>
  <p class="lead">同一組分數 z，先除以 T 再做 softmax。T 小，分佈變尖；T 大，分佈變平。<span class="tag">示意</span></p>
  <div id="g"></div>

  <div class="bridge" style="left:110px;top:690px;width:780px;height:200px;display:flex;flex-direction:column;justify-content:center"><span class="k">你已經會的</span>知識蒸餾裡的溫度 T，就是 softmax(z / T) 的那個 T。調的只有分佈的形狀，模型本身沒有變。</div>
  <div class="card"><div class="h">溫度只管隨機性，不管對錯</div>
    <p>T 再低，抽到的也只是「最有把握」的答案，它可能是錯的。要正確，靠提供資料與驗證。參數照模型官方建議：R1 distill 是 0.5–0.7，設 0 反而容易重複。</p></div>
  <div class="read"><em>怎麼讀：</em>三組長條是同一個分佈在三種 T 下的樣子；左邊最集中、右邊最平，下方卡片提醒溫度和對錯無關。</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r');
const g=document.getElementById('g');
const el=(x,y,w,h,t,st)=>{const e=document.createElement('div');e.className='a';e.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;`+(st||'');e.innerHTML=t;g.appendChild(e);return e};
const names=['好','熱','冷','糟','的'],p0=[.52,.18,.12,.07,.04],z=p0.map(Math.log);
const sm=T=>{const e=z.map(v=>Math.exp(v/T)),s=e.reduce((a,b)=>a+b);return e.map(v=>v/s)};
const panels=[{x:130,T:0.3,h:'T 低（0.3）',c:'更集中，幾乎只抽最高的那個'},{x:700,T:1,h:'T ＝ 1',c:'模型原本的分佈'},{x:1270,T:2,h:'T 高（2）',c:'更平，冷門的字也有機會'}];
panels.forEach(P=>{
  el(P.x,288,440,40,P.h,'font-size:30px;color:#2b4c7e');
  const v=sm(P.T),H=200,Y=345;
  const b=D.bars(P.x,Y,440,H,v,['#d9e1ee'],1,{fillStyle:'solid',stroke:D.C.ind,strokeWidth:2.4});
  b.forEach((r,i)=>{if(i===0)D.rect(r.x,r.y,r.w,r.h,'#f7d6cf',{fillStyle:'solid',stroke:D.C.ver,strokeWidth:2.4});
    el(r.x-10,r.y-32,r.w+20,28,v[i].toFixed(2),'font-size:22px;color:#5b574f');
    el(r.x-10,Y+H+6,r.w+20,34,names[i],'font-size:26px');});
  el(P.x,Y+H+50,440,40,P.c,'font-size:26px;color:#5b574f');
});
D.cross(1010,732,20);
</script></body></html>
