<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>模組四 面試題</title>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/vendor/rough.js"></script><script src="../assets/draw.js"></script>
<style>
.t{position:absolute;font-size:24px;line-height:1.3;white-space:nowrap}
.t.qt{font-size:30px;line-height:1.42;white-space:normal}
.t.qk{color:#b98a12}
.t.n{font-size:26px;line-height:42px;height:42px;text-align:center;color:#fff}
.t.c{text-align:center}
</style></head><body><div class="slide">
  <h1>模組四面試題</h1>
  <p class="lead">挑兩三個維度講透，比全列更有說服力。</p>
  <div id="g"></div>
  <div class="read"><em>怎麼讀：</em>左邊黃框是題目，右邊小圖把「回答維度」畫在本章主視覺上（示意）；紅圈編號是回答順序，先講 1 再講 2。</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r'),G=document.getElementById('g');
/* ── 共用版型：左題目卡、右縮圖面板、紅圈編號＝回答順序 ── */
const IN=['#d9e1ee',D.C.ind],MU=['#f7e7c0','#b98a12'],VR=['#f7d6cf',D.C.ver],PA=['#fbf9f4',D.C.grey],GY=['#ece8dc',D.C.grey];
const T=(x,y,t,c,w,st)=>{const e=document.createElement('div');e.className='t '+(c||'');e.style.cssText=`left:${x}px;top:${y}px;`+(w?`width:${w}px;`:'')+(st||'');e.innerHTML=t;G.appendChild(e);return e};
const R=(x,y,w,h,f,o)=>D.rect(x,y,w,h,f[0],Object.assign({fillStyle:'solid',stroke:f[1],strokeWidth:2.6},o));
const S=(x,y,s,f,o)=>R(x,y,s,s,f,o);
const A=(x1,y1,x2,y2,o)=>D.arrow(x1,y1,x2,y2,Object.assign({strokeWidth:2.6},o));
const LN=(x1,y1,x2,y2,o)=>D.line(x1,y1,x2,y2,Object.assign({strokeWidth:2.4},o));
const DS=(x1,y1,x2,y2,o)=>D.dash(x1,y1,x2,y2,Object.assign({strokeWidth:2.4},o));
const TL=(cx,cy,s)=>D.tri(cx,cy,s,'mus',{strokeWidth:2.4});
const GT=(cx,cy,s)=>D.tri(cx,cy,s,'#f7d6cf',{stroke:D.C.ver,strokeWidth:2.6});
const MC=(cx,cy,d)=>D.ci(cx,cy,d,'ver',{fillStyle:'hachure',strokeWidth:2.4});
const ML=(cx,cy,d,o)=>D.ci(cx,cy,d,'#f7d6cf',Object.assign({fillStyle:'solid',stroke:D.C.ver,strokeWidth:2.6},o));
const N=(x,y,n)=>{D.ci(x,y,42,'ver',{fillStyle:'solid',stroke:D.C.ver,strokeWidth:2});T(x-21,y-21,n,'n',42)};
const chip=(x,y,s,t,f)=>{S(x,y,s,f);T(x,y,t,'c',s,`height:${s}px;line-height:${s}px;font-size:26px`)};
const LB=(x,y,w,h,t,f,fs)=>{R(x,y,w,h,f);T(x,y,t,'c',w,`height:${h}px;line-height:${h}px;font-size:${fs||24}px`)};
const card=(i,y,H,q)=>{const QF=H>250?32:30;R(110,y,560,H,MU,{strokeWidth:3});T(140,y+16,'題 '+(i+1),'qk');
  T(140,y+50,`<div>${q}</div>`,'qt',500,`height:${H-64}px;display:flex;align-items:center;font-size:${QF}px`);
  A(676,y+H/2,716,y+H/2,{strokeWidth:3});R(722,y,1088,H,PA,{strokeWidth:3});};
const ROWS=[280,503,726],H=205;

/* 題 1：向量 RAG vs GraphRAG */
card(0,ROWS[0],H,'向量 RAG 與 GraphRAG 各自的邊界在哪？什麼問題非得用 GraphRAG？');
(()=>{const x=722,y=ROWS[0];
  N(x+40,y+32,1);T(x+68,y+18,'單點事實 vs 多跳、全局');
  [[30,86],[96,112],[160,84],[224,114],[286,88],[346,116]].forEach(([dx,dy],i)=>S(x+dx,y+dy,40,i===2?MU:IN,{strokeWidth:2.2}));
  const P={a:[440,114],b:[520,90],c:[600,122],d:[690,94],e:[530,152],f:[630,154],g:[716,142]};
  const ct=k=>[x+P[k][0]+18,y+P[k][1]+18];
  [['b','e'],['c','f'],['c','g'],['e','f']].forEach(([u,v])=>LN(...ct(u),...ct(v),{strokeWidth:2}));
  [['a','b'],['b','c'],['c','d']].forEach(([u,v])=>{const [x1,y1]=ct(u),[x2,y2]=ct(v);const an=Math.atan2(y2-y1,x2-x1);A(x1+22*Math.cos(an),y1+22*Math.sin(an),x2-24*Math.cos(an),y2-24*Math.sin(an),{stroke:D.C.ver,strokeWidth:3})});
  Object.keys(P).forEach(k=>S(x+P[k][0],y+P[k][1],36,'abcd'.includes(k)?IN:GY,{strokeWidth:2.2}));
  N(x+40,y+180,2);T(x+68,y+166,'獨立片段 vs 實體關係');
  N(x+580,y+32,3);T(x+608,y+18,'建圖與索引<br>的 LLM 成本');
  MC(x+822,y+142,58);A(x+792,y+136,x+756,y+122,{strokeWidth:2.4});
  N(x+880,y+32,4);T(x+908,y+18,'先用 Basic<br>當基線對照');
  LB(x+900,y+112,110,50,'Basic',IN);
})();

/* 題 2：社群報告（408 縮圖） */
card(1,ROWS[1],H,'社群報告怎麼建？它在全局提問裡起什麼作用？');
(()=>{const x=722,y=ROWS[1];
  N(x+40,y+34,1);T(x+68,y+20,'Leiden<br>分層社群');
  N(x+270,y+34,2);T(x+298,y+20,'每個社群請 LLM<br>預寫報告');
  N(x+580,y+34,3);T(x+608,y+20,'Global：對報告<br>map-reduce');
  N(x+860,y+34,4);T(x+888,y+20,'代價：索引貴、<br>查詢耗 token');
  const hex=(cx,cy,r,st)=>D.poly([0,1,2,3,4,5].map(k=>[cx+r*Math.cos(Math.PI/3*k),cy+r*0.9*Math.sin(Math.PI/3*k)]),null,{stroke:st,strokeLineDash:[6,6],strokeWidth:2.4});
  [[55,IN],[135,MU],[215,VR]].forEach(([cx,f])=>{hex(x+cx,y+148,34,f[1]);[[-10,-8],[8,-6],[-2,10]].forEach(([dx,dy])=>S(x+cx+dx-6,y+148+dy-6,12,f,{strokeWidth:1.8,roughness:0.6}))});
  A(x+254,y+148,x+300,y+148,{strokeWidth:2.4});ML(x+330,y+148,44);
  [[IN,104],[MU,137],[VR,170]].forEach(([f,r0],i)=>{const ry=y+r0;A(x+356,y+148,x+392,ry+13,{strokeWidth:2});R(x+396,ry,80,26,f,{strokeWidth:2.2});
    A(x+480,ry+13,x+506,ry+13,{strokeWidth:2});MC(x+522,ry+13,30);A(x+538,ry+13,x+606,y+150+(i-1)*8,{strokeWidth:2})});
  MC(x+640,y+150,64);A(x+676,y+150,x+716,y+150);LB(x+720,y+128,80,44,'答案',['#ffffff',D.C.ink]);
  MC(x+900,y+122,44);T(x+930,y+108,'索引');MC(x+900,y+172,44);T(x+930,y+158,'查詢');
})();

/* 題 3：兩派 GraphRAG（407 縮圖） */
card(2,ROWS[2],H,'Microsoft GraphRAG 和 Neo4j 系的做法差在哪？');
(()=>{const x=722,y=ROWS[2];
  N(x+40,y+104,1);
  T(x+72,y+40,'Microsoft<br>社群報告','ind');T(x+72,y+122,'Neo4j 系<br>Cypher 多跳','mus');
  N(x+484,y+26,2);T(x+514,y+12,'入口：實體向量 vs 角色名');
  const t=y+74,b=y+152;
  // 上排 Microsoft
  MC(x+246,t,38);A(x+272,t,x+296,t,{strokeWidth:2.2});
  [[326,IN],[386,MU]].forEach(([cx,f])=>{D.poly([0,1,2,3,4,5].map(k=>[x+cx+26*Math.cos(Math.PI/3*k),t+24*Math.sin(Math.PI/3*k)]),null,{stroke:f[1],strokeLineDash:[5,5],strokeWidth:2.2});S(x+cx-8,t-8,16,f,{strokeWidth:1.8,roughness:0.6})});
  MC(x+468,t,38);A(x+494,t,x+518,t,{strokeWidth:2.2});[0,1,2].forEach(i=>S(x+524+i*36,t-14,26,i===1?MU:IN,{strokeWidth:2.2}));
  LB(x+650,t-18,78,36,'報告',IN);A(x+734,t,x+762,t,{strokeWidth:2.2});S(x+768,t-14,28,IN,{strokeWidth:2.2});
  // 下排 Neo4j
  MC(x+246,b,38);A(x+272,b,x+296,b,{strokeWidth:2.2});
  [0,1,2].forEach(i=>{S(x+306+i*48,b-12,24,IN,{strokeWidth:2.2});if(i<2)LN(x+330+i*48,b,x+354+i*48,b,{strokeWidth:2.2})});
  MC(x+468,b,38);A(x+494,b,x+518,b,{strokeWidth:2.2});LB(x+524,b-18,86,36,'韓立',MU);
  TL(x+664,b+4,50);A(x+694,b,x+718,b,{strokeWidth:2.2});
  [0,1,2].forEach(i=>{S(x+726+i*34,b-12,22,IN,{strokeWidth:2.2});if(i<2)LN(x+748+i*34,b,x+758+i*34,b,{strokeWidth:2.2})});
  N(x+852,t,4);T(x+880,t-32,'GraphRAG 已大致<br>進入維護模式');
  N(x+852,b,3);T(x+880,b-32,'Neo4j 系要<br>schema 與消歧');
})();

</script></body></html>
