<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>N×M 整合爆炸</title>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/vendor/rough.js"></script><script src="../assets/draw.js"></script>
<style>
.al{position:absolute;width:150px;text-align:right;font-size:26px}
.tl{position:absolute;font-size:26px}
.big{position:absolute;font-size:38px;line-height:1.3}
</style></head><body><div class="slide">
  <h1>MCP：把 N × M 變成 N + M</h1>
  <p class="lead">每個 AI 應用都要為每個工具各寫一套接頭；MCP 讓雙方都只對一個協定。<span class="tag">示意</span></p>

  <h2 class="abs ver" style="left:110px;top:285px">沒有 MCP</h2>
  <h2 class="abs ind" style="left:1020px;top:285px">有 MCP</h2>

  <!-- 左：12 條 -->
  <div class="al" style="left:110px;top:404px">Claude</div>
  <div class="al" style="left:110px;top:544px">Cursor</div>
  <div class="al" style="left:110px;top:684px">VS Code</div>
  <div class="tl" style="left:790px;top:364px">檔案</div>
  <div class="tl" style="left:790px;top:484px">資料庫</div>
  <div class="tl" style="left:790px;top:604px">搜尋</div>
  <div class="tl" style="left:790px;top:724px">行事曆</div>
  <!-- 右：7 條 -->
  <div class="al" style="left:1000px;top:404px;width:140px">Claude</div>
  <div class="al" style="left:1000px;top:544px;width:140px">Cursor</div>
  <div class="al" style="left:1000px;top:684px;width:140px">VS Code</div>
  <div class="tl" style="left:1706px;top:364px">檔案</div>
  <div class="tl" style="left:1706px;top:484px">資料庫</div>
  <div class="tl" style="left:1706px;top:604px">搜尋</div>
  <div class="tl" style="left:1706px;top:724px">行事曆</div>
  <div class="abs" style="left:1380px;top:528px;width:90px;text-align:center;font-size:34px">MCP</div>

  <div class="big" style="left:110px;top:815px"><span class="ver">3 × 4 = 12</span> 個客製接頭</div>
  <div class="big" style="left:1020px;top:815px"><span class="ind">3 + 4 = 7</span> 個標準介面</div>
  <div class="abs note" style="left:110px;top:872px;width:800px">多一個工具，每個應用都要再寫一個</div>
  <div class="abs note" style="left:1020px;top:872px;width:800px">多一個工具，只要它自己接一次</div>

  <div class="read"><em>怎麼讀：</em>圓是 AI 應用，三角是外部工具；左邊每對都拉一條線，右邊全都只接中間那條協定。</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r');
const AY=[420,560,700], TY=[380,500,620,740];
/* 左：全連線 */
AY.forEach(a=>TY.forEach(t=>D.line(382,a,672,t,{stroke:D.C.ver,strokeWidth:1.8,roughness:0.8})));
AY.forEach(a=>D.ci(330,a,100,'#d9e1ee',{fillStyle:'solid',stroke:D.C.ind,strokeWidth:3}));
TY.forEach(t=>D.tri(720,t,90,'mus',{strokeWidth:2.5}));
/* 右：匯流排 */
AY.forEach(a=>D.arrow(1282,a,1378,a,{strokeWidth:2.5}));
TY.forEach(t=>D.arrow(1472,t,1596,t,{strokeWidth:2.5}));
D.rect(1380,340,90,440,'#f7e7c0',{fillStyle:'solid',stroke:'#b98a12',strokeWidth:3});
AY.forEach(a=>D.ci(1232,a,100,'#d9e1ee',{fillStyle:'solid',stroke:D.C.ind,strokeWidth:3}));
TY.forEach(t=>D.tri(1640,t,90,'mus',{strokeWidth:2.5}));
D.dash(960,290,960,890,{strokeWidth:2,stroke:D.C.grey});
</script></body></html>
