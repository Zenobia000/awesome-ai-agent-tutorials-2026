<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>實體、關係、屬性</title>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/vendor/rough.js"></script><script src="../assets/draw.js"></script>
<style>
.el{position:absolute;white-space:nowrap;background:#f3efe6;padding:0 8px;font-size:24px;line-height:34px;color:var(--muted);transform:translate(-50%,-50%)}
.mono{font-family:"JetBrains Mono","Noto Sans Mono CJK TC",monospace;font-size:24px;line-height:1.45;color:var(--ink)}
.def .t{font-size:34px;line-height:1.3}.def .d{font-size:26px;line-height:1.5;color:var(--muted);margin-top:4px}
</style></head><body><div class="slide">
  <h1>知識圖譜：實體、關係、屬性</h1>
  <p class="lead">把文字拆成「誰」「和誰」「什麼關係」——每條邊讀起來，就是一句話。</p>

  <div class="abs def" style="left:1330px;top:300px;width:480px"><div class="t ind">實體（節點）</div><div class="d">圖裡的一個「東西」：一個人、一個宗門、一件法寶。</div></div>
  <div class="abs def" style="left:1330px;top:495px;width:480px"><div class="t ver">關係（邊）</div><div class="d">有方向、有型別的連線。讀成一句話：韓立 屬於 七玄門。</div></div>
  <div class="abs def" style="left:1330px;top:690px;width:480px"><div class="t mus">屬性</div><div class="d">掛在節點上的「鍵：值」。例：name 是「韓立」。</div></div>

  <div class="read"><em>怎麼讀：</em>方塊是實體，箭頭是關係；方塊的顏色是實體的類型，旁邊的大括號是屬性。</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r');
const S=document.querySelector('.slide');
const T=(x,y,w,h,html,sty,cls)=>{const d=document.createElement('div');d.className='abs '+(cls||'');d.style.cssText=`left:${x}px;top:${y}px;`+(w?`width:${w}px;`:'')+(h?`height:${h}px;`:'')+(sty||'');d.innerHTML=html;S.appendChild(d);return d;};
const FILL={p:['#d9e1ee',D.C.ind],s:['#f7e7c0','#b98a12'],w:['#f7d6cf',D.C.ver]};
const nd=(cx,cy,w,h,t,k,fs)=>{const f=FILL[k];D.rect(cx-w/2,cy-h/2,w,h,f[0],{fillStyle:'solid',stroke:f[1],strokeWidth:3});T(cx-w/2,cy-h/2,w,h,t,`display:flex;align-items:center;justify-content:center;font-size:${fs||28}px;`);return {cx,cy,w,h};};
const clip=(b,tx,ty,pad)=>{const dx=tx-b.cx,dy=ty-b.cy,k=Math.min((b.w/2+pad)/Math.abs(dx||1e-9),(b.h/2+pad)/Math.abs(dy||1e-9));return [b.cx+dx*k,b.cy+dy*k];};
const link=(a,b,lbl,o)=>{const [x1,y1]=clip(a,b.cx,b.cy,6),[x2,y2]=clip(b,a.cx,a.cy,8);D.arrow(x1,y1,x2,y2,Object.assign({strokeWidth:3},o));
  if(lbl){const d=T((x1+x2)/2,(y1+y2)/2,0,0,lbl,'','el');d.style.position='absolute';}};

/* 圖例：標籤＝實體類型 */
[['p','Person 人物',110],['s','Sect 宗門',400],['w','Treasure 法寶',660]].forEach(([k,t,x])=>{const f=FILL[k];D.rect(x,282,28,28,f[0],{fillStyle:'solid',stroke:f[1],strokeWidth:2.5});T(x+40,278,300,34,t,'font-size:24px;line-height:34px');});

const ly=nd(250,385,150,72,'厲飛雨','p'), qx=nd(250,565,170,72,'七玄門','s'), hf=nd(250,805,170,72,'黃楓谷','s');
const hl=nd(700,650,170,84,'韓立','p',32);
const zt=nd(1090,495,170,72,'掌天瓶','w'), qz=nd(1090,805,210,72,'青竹蜂雲劍','w');
link(ly,qx,'MEMBER_OF');link(hl,qx,'MEMBER_OF');link(hl,hf,'MEMBER_OF');link(hl,zt,'OWNS');link(hl,qz,'OWNS');

/* 屬性：虛線連到節點旁的大括號 */
D.dash(700,694,700,740,{strokeWidth:2.5,stroke:D.C.grey});
T(585,742,300,40,'{ name: "韓立" }','','mono');
D.dash(1090,843,1090,868,{strokeWidth:2.5,stroke:D.C.grey});
T(960,870,300,80,'{ name: "青竹蜂雲劍",<br>&nbsp;&nbsp;kind: "飛劍" }','','mono');
</script></body></html>
