<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>attention 直覺</title>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/vendor/rough.js"></script><script src="../assets/draw.js"></script>
<style>
.a{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;font-size:28px}
</style></head><body><div class="slide">
  <h1>attention：每個位置，加權看所有位置</h1>
  <p class="lead">不再把一切壓進一個向量。處理某個字時，直接看句子裡所有的字，依相關程度決定看誰、看多重。<span class="tag">示意</span></p>
  <div id="g"></div>
  <div class="a" style="left:110px;top:772px;width:1700px;justify-content:flex-start;font-size:28px">新的「牠」＝ 0.50 × 動物 ＋ 0.20 × 馬路 ＋ 0.06 × 累 ＋ …（各字的向量，依權重相加）</div>
  <div class="bridge inline" style="left:110px;top:832px;width:1700px"><span class="k">你已經會的</span>全連接層的權重訓練完就固定了；attention 的權重，每次都依輸入內容重新算。</div>
  <div class="read"><em>怎麼讀：</em>朱紅色的「牠」是正在處理的位置；弧線越粗，代表它越重視那個字。底下的數字是每個字的權重（太小的不畫弧線）。</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r');
const g=document.getElementById('g');
const el=(x,y,w,h,t,st)=>{const e=document.createElement('div');e.className='a';e.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;`+(st||'');e.innerHTML=t;g.appendChild(e);return e};
const T=['動物','沒有','過','馬路','，','因為','牠','太','累','了'];
const W=[.50,.03,.02,.20,.02,.05,.08,.02,.06,.02],Q=6,X0=190,P=155,CW=135,Y=585;
const cx=i=>X0+i*P+CW/2;
/* 弧線先畫，方塊後畫 */
T.forEach((t,i)=>{ if(i===Q||W[i]<.03)return; const dx=Math.abs(cx(i)-cx(Q)),H=50+dx*0.22,strong=W[i]>=.15;
  D.curve([[cx(Q),Y-4],[(cx(Q)+cx(i))/2,Y-4-H],[cx(i),Y-4]],{stroke:strong?D.C.ver:D.C.grey,strokeWidth:1.6+W[i]*14,roughness:0.8});});
T.forEach((t,i)=>{const x=X0+i*P,q=i===Q;
  D.rect(x,Y,CW,72,q?'#f7d6cf':'#d9e1ee',{fillStyle:'solid',stroke:q?D.C.ver:D.C.ind,strokeWidth:q?4:2.5});
  el(x,Y,CW,72,t,'font-size:30px');
  el(x,Y+80,CW,36,W[i].toFixed(2),'font-size:26px;color:'+(W[i]>=.15?'#e0442b':'#5b574f'));});
el(110,Y+80,80,36,'權重','font-size:24px;color:#5b574f;justify-content:flex-start');
</script></body></html>
