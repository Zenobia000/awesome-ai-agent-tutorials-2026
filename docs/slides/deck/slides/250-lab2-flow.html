<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Lab2：SQL 流程</title>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/vendor/rough.js"></script><script src="../assets/draw.js"></script>
<style>
.bx{position:absolute;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3}
.bx .m{font-family:"JetBrains Mono",monospace;font-size:22px}
.hd{position:absolute;font-size:28px;text-align:center;line-height:1.3}
.cp{position:absolute;font-size:24px;line-height:1.4;color:var(--muted);text-align:center}
.warn{position:absolute;left:110px;top:745px;width:1700px;padding:22px 30px;font-size:28px;line-height:1.55}
.warn .k{display:block;font-size:24px;color:var(--ver);margin-bottom:6px}
</style></head><body><div class="slide">
  <h1>Lab 2：Text2SQL 處理流程</h1>
  <p class="lead">注入 DDL、結構化生成、程式驗證；破壞性語句直接拒絕，語法錯誤才回頭重寫。</p>

  <div id="bx"></div>
  <div class="hd ind" style="left:340px;top:272px;width:230px">注入 DDL</div>
  <div class="hd ver" style="left:660px;top:272px;width:500px">生成</div>
  <div class="hd mus" style="left:1235px;top:272px;width:190px">驗證</div>
  <div class="cp" style="left:760px;top:652px;width:640px">語法錯誤：把錯誤訊息帶回 LLM 重寫（設重試上限）</div>

  <div class="warn"><span class="k">注意</span>SQLGenerationResult 的「安全性風險評級」是模型自評，不能當閘門。閘門要另寫程式判斷語句類型，再加唯讀帳號。</div>
  <div class="read"><em>怎麼讀：</em>由左往右。圓是模型，方是資料，三角是程式把關的閘門；虛線是只有語法錯誤才走的回頭路。</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r');
const host=document.getElementById('bx');
const lab=(x,y,w,h,html,fs)=>{const d=document.createElement('div');d.className='bx';Object.assign(d.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',fontSize:(fs||26)+'px'});d.innerHTML=html;host.appendChild(d);};
const Y=430, A={strokeWidth:2.6};
D.rect(110,375,160,110,'#d9e1ee',{fillStyle:'solid',stroke:D.C.ind,strokeWidth:3});lab(110,375,160,110,'使用者<br>問題');
D.arrow(278,Y,332,Y,A);
D.rect(340,335,230,190,'#d9e1ee',{fillStyle:'solid',stroke:D.C.ind,strokeWidth:3});lab(340,335,230,190,'<span style="font-size:30px">提示詞</span>DDL 結構<br>嚴格約束<br>少樣本示例<br>使用者問題',24);
D.arrow(578,Y,655,Y,A);
D.ci(755,Y,190,'#f7d6cf',{strokeWidth:3});lab(660,Y-95,190,190,'LLM<br><span style="font-size:22px;color:#5b574f">結構化輸出</span>',34);
D.arrow(858,Y,925,Y,A);
D.rect(930,375,230,110,'#d9e1ee',{fillStyle:'solid',stroke:D.C.ind,strokeWidth:3});lab(930,375,230,110,'<span class="m">SQLGeneration<br>Result</span>');
D.arrow(1168,Y,1232,Y,A);
D.tri(1330,Y,190,'#f7e7c0',{stroke:'#b98a12',strokeWidth:3});lab(1260,Y+8,140,50,'解析',26);
/* 通過 / 拒絕 */
D.arrow(1405,395,1555,335,A);
D.rect(1560,275,250,120,'#d9e1ee',{fillStyle:'solid',stroke:D.C.ind,strokeWidth:3});lab(1560,275,250,120,'<span style="color:#2b4c7e">SELECT 通過</span>唯讀帳號執行');
D.arrow(1405,470,1555,545,A);
D.rect(1560,495,250,120,'#f7d6cf',{fillStyle:'solid',stroke:D.C.ver,strokeWidth:3});lab(1560,495,250,120,'<span style="color:#e0442b">寫入類語句</span>拒絕，不重試');
/* 回頭路 */
D.dash(1330,520,1330,640,{strokeWidth:2.6});D.dash(1330,640,755,640,{strokeWidth:2.6});D.dash(755,640,755,540,{strokeWidth:2.6});
D.arrow(755,580,755,530,{strokeWidth:2.6});
document.fonts.ready.then(()=>D.frame('.warn','#f7d6cf',{stroke:D.C.ver,strokeWidth:3}));
</script></body></html>
