  <h1>RAG 是什麼</h1>
  <p class="lead" style="width:1700px">RAG（檢索增強生成）＝先去資料庫查出相關段落，連同問題一起交給模型，讓它照著資料回答。</p>
  <div class="hd ind" style="left:110px;top:290px">像開書考試</div>
  <div class="cap" style="left:110px;top:368px;color:var(--ink)">閉書</div>
  <div class="c" style="left:190px;top:368px;width:130px">題目</div>
  <div class="c" style="left:600px;top:372px;width:250px;font-size:24px">憑印象作答</div>
  <div class="cap" style="left:110px;top:560px;color:var(--ink)">開書</div>
  <div class="c" style="left:190px;top:560px;width:130px">題目</div>
  <div class="cap" style="left:360px;top:640px;font-size:24px">先翻書</div>
  <div class="c" style="left:690px;top:543px;width:190px;font-size:24px">照書作答<br>附上出處</div>
  <div class="cap" style="left:110px;top:720px">RAG 就是替模型「翻書」：查到的幾段，跟問題一起交給它。</div>
  <div class="hd mus" style="left:1000px;top:290px">你可能已經見過</div>
  <div class="it" style="top:350px">聊天機器人的搜尋模式：答案下面附出處連結</div>
  <div class="it" style="top:442px">公司內部的文件問答、客服機器人</div>
  <div class="it" style="top:534px">上傳一份 PDF，再對它發問</div>
  <div class="no"><div class="t ver">翻書也救不了的</div><div class="d">書裡沒有的，翻了也找不到<br>翻錯頁就答錯——本章大半在教怎麼翻對頁</div></div>
  <div class="read"><em>怎麼讀：</em>上排閉書只靠模型記憶，容易憑印象亂寫；下排先從文件（方塊）裡找出黃色那兩段，再交給模型（圓）作答。</div>
