[project]
name = "ai-agent-tutorials-2026"
version = "0.1.0"
description = "20 小時 AI Agent 課程的實作 notebook"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[dependency-groups]
m1 = ["tiktoken>=0.8", "torch>=2.3", "transformers>=4.45"]
dev = ["pytest>=8.0", "nbclient>=0.10", "nbformat>=5.10"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["course_utils"]
