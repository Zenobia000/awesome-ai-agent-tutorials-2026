# 旗艦專案基礎服務：PostgreSQL（LangGraph PostgresSaver）+ Neo4j（GraphRAG 拓撲）
# 密碼一律從 .env 讀取，不要寫死在這裡
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
    ports:
      - "127.0.0.1:${ONCALL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ONCALL_NEO4J_HTTP_PORT:-57474}:7474"
      - "127.0.0.1:${ONCALL_NEO4J_BOLT_PORT:-57687}:7687"
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
